<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d4d70" />
  <meta name="robots" content="noindex" />
  <title>Conexões Polo 1</title>
  <link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/ge9yksty/image/upload/v1790778059/ChatGPT_Image_30_de_set._de_2026_11_20_00.png">
  <link rel="stylesheet" href="styles.css" id="estilo-404" />
  <style>
    /* Estilos mínimos para o caso de a folha externa não carregar. */
    body { margin: 0; background: #fffaf3; color: #123047; font-family: Inter, ui-sans-serif, system-ui, sans-serif; line-height: 1.5; }
    .pagina-erro { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .pagina-erro-conteudo { max-width: 520px; text-align: center; }
    .pagina-erro h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0 0 10px; color: #0d4d70; }
    .pagina-erro p { margin: 0 0 22px; color: #5c7180; }
    .pagina-erro a { display: inline-block; background: #0d4d70; color: #fff; text-decoration: none; font-weight: 700; padding: 11px 20px; border-radius: 8px; }
  </style>
</head>
<body class="pagina-curso">
  <main class="pagina-erro">
    <div class="pagina-erro-conteudo">
      <h1>Curso não encontrado</h1>
      <p>Não localizamos um curso com esse endereço. Ele pode ter mudado de nome ou não fazer parte do catálogo atual.</p>
      <a href="index.html#cursos" id="link-catalogo">Ver todos os cursos</a>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      /* Caminho base do site, calculado a partir da URL pedida.
         - /Conexoes/cursos/ballet  -> /Conexoes/
         - /cursos/ballet           -> /                                   */
      function baseDoSite() {
        var caminho = window.location.pathname;
        var curso = caminho.match(/^(.*)\/cursos\/[^/?#]+\/?$/);
        if (curso) return curso[1] + '/';
        var barra = caminho.lastIndexOf('/');
        return barra >= 0 ? caminho.slice(0, barra + 1) : '/';
      }

      var base = baseDoSite();

      /* A folha de estilo e os links são resolvidos a partir da base real. */
      var estilo = document.getElementById('estilo-404');
      if (estilo) estilo.setAttribute('href', base + 'styles.css');
      var linkCatalogo = document.getElementById('link-catalogo');
      if (linkCatalogo) linkCatalogo.setAttribute('href', base + 'index.html#cursos');

      /* /cursos/<slug> vira a página do curso correspondente. */
      var partes = window.location.pathname.match(/\/cursos\/([^/?#]+)\/?$/);
      if (partes) {
        var slug = decodeURIComponent(partes[1]);
        window.location.replace(base + 'curso.html?c=' + encodeURIComponent(slug));
      }
    })();
  </script>
</body>
</html>
